services:
  - type: web
    name: whiteboard-app
    runtime: node
    plan: free
    branch: main
    # --include=dev forces devDependencies (vite, tailwind plugin) to install
    # even though NODE_ENV=production, which otherwise skips them and 127s.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        value: https://whitebored.onrender.com
      - key: CLIENT_ORIGIN
        value: https://whitebored-client.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_VISION_KEY
        sync: false
      # Sketch-to-Notes: every AI feature routes through the central Gemini module.
      # Without this key the module returns null and notes/cards/chat/coverage all
      # degrade to "not configured" rather than erroring — set it in the dashboard.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_EMBED_MODEL
        value: text-embedding-004
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
