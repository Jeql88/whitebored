services:
  - type: web
    name: whitebored
    runtime: node
    plan: free
    branch: main
    # --include=dev forces devDependencies (vite, tailwind plugin) to install
    # even though NODE_ENV=production, which otherwise skips them and 127s.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      # MUST match this service's own public URL or auth callbacks break. If the
      # service is recreated under a different name, update this to the new
      # hostname (and the Google OAuth redirect URI) before signing in.
      - key: BETTER_AUTH_URL
        value: https://whitebored.onrender.com
      - key: CLIENT_ORIGIN
        value: https://whitebored-client.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_VISION_KEY
        sync: false
      # Sketch-to-Notes: every AI feature routes through the central Gemini module.
      # Without a key the module returns null and notes/cards/chat/coverage all
      # degrade to "not configured" rather than erroring.
      # Set the value in the dashboard; verify with /healthz/config.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
